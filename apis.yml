aid: pointclickcare
name: PointClickCare
description: >-
  PointClickCare is the leading cloud-based software platform for the senior care and post-acute care industry,
  providing electronic health records (EHR), care coordination, financial management, and clinical decision support to
  skilled nursing facilities, senior living communities, and home health agencies. PointClickCare publishes both a
  partner EHR API and a HL7 FHIR API for clinical interoperability across the long-term and post-acute care (LTPAC)
  ecosystem.

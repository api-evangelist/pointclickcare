naftiko: 1.0.0-alpha2
info:
  label: PointClickCare Long-Term Care EHR API — Facilities
  description: 'PointClickCare Long-Term Care EHR API — Facilities. 1 operations. Lead operation: List facilities. Self-contained
    Naftiko capability covering one Pointclickcare business surface.'
  tags:
  - Pointclickcare
  - Facilities
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    POINTCLICKCARE_API_KEY: POINTCLICKCARE_API_KEY
capability:
  consumes:
  - type: http
    namespace: ehr-facilities
    baseUri: https://api.pointclickcare.com/v2
    description: PointClickCare Long-Term Care EHR API — Facilities business capability. Self-contained, no shared references.
    resources:
    - name: facilities
      path: /facilities
      operations:
      - name: listfacilities
        method: GET
        description: List facilities
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    authentication:
      type: bearer
      token: '{{env.POINTCLICKCARE_API_KEY}}'
  exposes:
  - type: rest
    namespace: ehr-facilities-rest
    port: 8080
    description: REST adapter for PointClickCare Long-Term Care EHR API — Facilities. One Spectral-compliant resource per
      consumed operation, prefixed with /v1.
    resources:
    - path: /v1/facilities
      name: facilities
      description: REST surface for facilities.
      operations:
      - method: GET
        name: listfacilities
        description: List facilities
        call: ehr-facilities.listfacilities
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: ehr-facilities-mcp
    port: 9090
    transport: http
    description: MCP adapter for PointClickCare Long-Term Care EHR API — Facilities. One tool per consumed operation, routed
      inline through this capability's consumes block.
    tools:
    - name: list-facilities
      description: List facilities
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: ehr-facilities.listfacilities
      outputParameters:
      - type: object
        mapping: $.

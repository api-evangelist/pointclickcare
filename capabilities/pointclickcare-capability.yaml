      - name: endDate
        type: string
        description: endDate
      - name: vitalType
        type: string
        description: Filter by vital type
      - name: limit
        type: integer
        description: limit
      outputParameters:
      - type: object
        mapping: $.
    - name: getpatientmedications
      description: Get patient medication orders
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: pointclickcare.getpatientmedications
      with:
        status: tools.status
        startDate: tools.startDate
        endDate: tools.endDate
      inputParameters:
      - name: status
        type: string
        description: Filter by order status
      - name: startDate

naftiko: 1.0.0-alpha2
info:
  label: PointClickCare Long-Term Care EHR API
  description: PointClickCare provides EHR and care coordination APIs for long-term and post-acute care (LTPAC) facilities.
    APIs enable access to resident records, medication administration records, clinical assessments, care plans, and facility
    data for skilled nursing facilities (SNFs) and senior living communities.
  tags:
  - Pointclickcare
  - API
  created: '2026-05-06'
  modified: '2026-05-06'
capability:
  consumes:
  - type: http
    namespace: pointclickcare
    baseUri: https://api.pointclickcare.com/v2
    description: PointClickCare Long-Term Care EHR API HTTP API.
    authentication:
      type: bearer
      token: '{{POINTCLICKCARE_TOKEN}}'
    resources:
    - name: patients
      path: /patients
      operations:
      - name: listpatients
        method: GET
        description: List residents/patients
        inputParameters:
        - name: facilityId
          in: query
          type: string
          required: true
          description: Facility identifier
        - name: status
          in: query
          type: string
          description: Filter by admission status
        - name: unitId
          in: query
          type: string
          description: Filter by unit/floor
        - name: updatedSince
          in: query
          type: string
          description: Return only records updated after this timestamp
        - name: offset
          in: query
          type: integer
        - name: limit
          in: query
          type: integer
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    - name: patients-patientid
      path: /patients/{patientId}
      operations:
      - name: getpatient
        method: GET
        description: Get a resident/patient
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    - name: patients-patientid-vitals
      path: /patients/{patientId}/vitals
      operations:
      - name: getpatientvitals
        method: GET
        description: Get patient vitals
        inputParameters:
        - name: startDate
          in: query
          type: string
        - name: endDate
          in: query
          type: string
        - name: vitalType
          in: query
          type: string
          description: Filter by vital type
        - name: limit
          in: query
          type: integer
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    - name: patients-patientid-medications
      path: /patients/{patientId}/medications
      operations:
      - name: getpatientmedications
        method: GET
        description: Get patient medication orders
        inputParameters:
        - name: status
          in: query
          type: string
          description: Filter by order status
        - name: startDate
          in: query
          type: string
        - name: endDate
          in: query
          type: string
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    - name: patients-patientid-medications-mar
      path: /patients/{patientId}/medications/mar
      operations:
      - name: getpatientmar
        method: GET
        description: Get medication administration records
        inputParameters:
        - name: startDate
          in: query
          type: string
          required: true
        - name: endDate
          in: query
          type: string
          required: true
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    - name: patients-patientid-assessments
      path: /patients/{patientId}/assessments
      operations:
      - name: listpatientassessments
        method: GET
        description: List patient assessments
        inputParameters:
        - name: type
          in: query
          type: string
          description: Filter by assessment type
        - name: startDate
          in: query
          type: string
        - name: endDate
          in: query
          type: string
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    - name: patients-patientid-diagnoses
      path: /patients/{patientId}/diagnoses
      operations:
      - name: getpatientdiagnoses
        method: GET
        description: Get patient diagnoses
        inputParameters:
        - name: status
          in: query
          type: string
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    - name: facilities
      path: /facilities
      operations:
      - name: listfacilities
        method: GET
        description: List facilities
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
  exposes:
  - type: rest
    port: 8080
    namespace: pointclickcare-rest
    description: REST adapter for PointClickCare Long-Term Care EHR API.
    resources:
    - path: /patients
      name: listpatients
      operations:
      - method: GET
        name: listpatients
        description: List residents/patients
        call: pointclickcare.listpatients
        outputParameters:
        - type: object
          mapping: $.
    - path: /patients/{patientId}
      name: getpatient
      operations:
      - method: GET
        name: getpatient
        description: Get a resident/patient
        call: pointclickcare.getpatient
        outputParameters:
        - type: object
          mapping: $.
    - path: /patients/{patientId}/vitals
      name: getpatientvitals
      operations:
      - method: GET
        name: getpatientvitals
        description: Get patient vitals
        call: pointclickcare.getpatientvitals
        outputParameters:
        - type: object
          mapping: $.
    - path: /patients/{patientId}/medications
      name: getpatientmedications
      operations:
      - method: GET
        name: getpatientmedications
        description: Get patient medication orders
        call: pointclickcare.getpatientmedications
        outputParameters:
        - type: object
          mapping: $.
    - path: /patients/{patientId}/medications/mar
      name: getpatientmar
      operations:
      - method: GET
        name: getpatientmar
        description: Get medication administration records
        call: pointclickcare.getpatientmar
        outputParameters:
        - type: object
          mapping: $.
    - path: /patients/{patientId}/assessments
      name: listpatientassessments
      operations:
      - method: GET
        name: listpatientassessments
        description: List patient assessments
        call: pointclickcare.listpatientassessments
        outputParameters:
        - type: object
          mapping: $.
    - path: /patients/{patientId}/diagnoses
      name: getpatientdiagnoses
      operations:
      - method: GET
        name: getpatientdiagnoses
        description: Get patient diagnoses
        call: pointclickcare.getpatientdiagnoses
        outputParameters:
        - type: object
          mapping: $.
    - path: /facilities
      name: listfacilities
      operations:
      - method: GET
        name: listfacilities
        description: List facilities
        call: pointclickcare.listfacilities
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    port: 9090
    namespace: pointclickcare-mcp
    transport: http
    description: MCP adapter for PointClickCare Long-Term Care EHR API for AI agent use.
    tools:
    - name: listpatients
      description: List residents/patients
      hints:
        readOnly: true
        destructive: false
        idempotent: true
